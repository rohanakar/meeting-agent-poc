name: meeting-agent

x-app: &app
  build:
    context: .
    dockerfile: docker/app.Dockerfile
  image: meeting-agent-app:latest
  env_file:
    - path: .env
      required: false
  environment:
    DATABASE_URL: postgresql+psycopg://meeting:meeting@postgres:5432/meeting_agent
    REDIS_URL: redis://redis:6379/0
    DATA_DIR: /data
  volumes:
    - data:/data
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_started

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: meeting
      POSTGRES_PASSWORD: meeting
      POSTGRES_DB: meeting_agent
    ports:
      - "5442:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meeting -d meeting_agent"]
      interval: 2s
      retries: 30

  redis:
    image: redis:7-alpine
    ports:
      - "6392:6379"

  api:
    <<: *app
    command: sh -c "alembic upgrade head && uvicorn meeting_agent.api.app:app --host 0.0.0.0 --port 8000"
    ports:
      - "8040:8000"

  # One process per bot that may run at the same time: run_bot blocks until its bot exits.
  worker-bots:
    <<: *app
    command: rq worker --with-scheduler --url redis://redis:6379/0 bots
    volumes:
      - data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    deploy:
      replicas: ${MAX_CONCURRENT_BOTS:-2}

  worker-pipeline:
    <<: *app
    command: rq worker --url redis://redis:6379/0 pipeline

volumes:
  pgdata:
  # Fixed name: the worker mounts it into the bot containers it starts.
  data:
    name: meeting-agent-data

networks:
  default:
    name: meeting-agent
