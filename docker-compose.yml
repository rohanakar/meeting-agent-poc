name: meeting-agent

x-app: &app
  build:
    context: .
    dockerfile: docker/Dockerfile
  image: meeting-agent:latest
  env_file:
    - path: .env
      required: false
  environment:
    DATABASE_URL: postgresql+psycopg://meeting:meeting@postgres:5432/meeting_agent
    REDIS_URL: redis://redis:6379/0
    DATA_DIR: /data
  volumes:
    - data:/data
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_started

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: meeting
      POSTGRES_PASSWORD: meeting
      POSTGRES_DB: meeting_agent
    ports:
      - "5442:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meeting -d meeting_agent"]
      interval: 2s
      retries: 30

  redis:
    image: redis:7-alpine
    ports:
      - "6392:6379"

  api:
    <<: *app
    command: sh -c "alembic upgrade head && uvicorn meeting_agent.api.app:app --host 0.0.0.0 --port 8000"
    ports:
      - "8040:8000"
    # Healthy once migrations are done and the API answers, so `docker compose up --wait` returns
    # only then, and nothing in front of it (a proxy, a deploy check) sees it starting.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 60s

  # One process per bot that may run at the same time: run_bot blocks until its bot exits.
  worker-bots:
    <<: *app
    command: rq worker --with-scheduler --url redis://redis:6379/0 bots
    volumes:
      - data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    deploy:
      replicas: ${MAX_CONCURRENT_BOTS:-2}

  # The Docker socket: stop_bot runs here, so Stop works while every bots worker is busy.
  worker-pipeline:
    <<: *app
    command: rq worker --url redis://redis:6379/0 pipeline
    volumes:
      - data:/data
      - /var/run/docker.sock:/var/run/docker.sock

  # One-time sign-in for the bot account: docker compose --profile login up bot-login,
  # then open http://localhost:6080/vnc.html. Published on localhost only.
  bot-login:
    <<: *app
    profiles: [login]
    command: ["bot-login"]
    ports:
      - "127.0.0.1:6080:6080"

volumes:
  pgdata:
  # Fixed name: the worker mounts it into the bot containers it starts.
  data:
    name: meeting-agent-data

networks:
  default:
    name: meeting-agent
