# meeting-agent with local stand-ins for Anthropic (summary and embeddings) and ElevenLabs.
# The bot still joins real meetings; only the provider APIs are mocked, all with the key "test".
#
#   mkdir -p data
#   docker compose -f docker-compose.yml -f docker-compose.mock.yml up -d --build
#
# Needs CLAUDE_CODE_OAUTH_TOKEN in .env (run `claude setup-token`). Meeting folders live in
# ./data/meetings/<meeting id>/; put transcript.txt or transcript.json next to audio.ogg.

x-mock-providers: &mock-providers
  ANTHROPIC_API_KEY: test
  ANTHROPIC_BASE_URL: http://mock-anthropic:11435
  OPENAI_API_KEY: test
  OPENAI_BASE_URL: http://mock-anthropic:11435/v1
  ELEVENLABS_API_KEY: test
  ELEVENLABS_BASE_URL: http://mock-elevenlabs:11437
  # The worker mounts this volume into each bot container.
  DATA_VOLUME: meeting-agent-mock-data

services:
  api:
    environment: *mock-providers
  worker-bots:
    environment: *mock-providers
  worker-pipeline:
    environment: *mock-providers

  mock-anthropic:
    build:
      context: .
      dockerfile: mocks/anthropic/Dockerfile
    image: meeting-agent-mock-anthropic:latest
    environment:
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      MOCK_API_KEY: test
    ports:
      - "11445:11435"   # GET /__mock__/calls shows what the mock answered

  mock-elevenlabs:
    build:
      context: .
      dockerfile: mocks/elevenlabs/Dockerfile
    image: meeting-agent-mock-elevenlabs:latest
    environment:
      MOCK_API_KEY: test
      DATA_DIR: /data
    volumes:
      - data:/data:ro
    ports:
      - "11447:11437"

volumes:
  # A folder on this machine instead of a Docker volume, so transcripts can be put in by hand.
  data:
    name: meeting-agent-mock-data
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PWD}/data
