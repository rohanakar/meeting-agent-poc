[project]
name = "meeting-agent"
version = "0.1.0"
description = "POC: an agent that joins online meetings, records, transcribes and summarises them"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.14",
    "anthropic>=0.70",
    "cryptography>=44",
    "docker>=7.1",
    "elevenlabs>=2.0",
    "fastapi>=0.115",
    "httpx>=0.28",
    "openai>=1.60",
    "pgvector>=0.3.6",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.7",
    "redis>=5.2",
    "rq>=2.1",
    "sqlalchemy>=2.0.36",
    "uvicorn[standard]>=0.34",
]

[project.optional-dependencies]
bot = ["playwright>=1.49"]

[dependency-groups]
dev = ["httpx2>=2.12", "pytest>=8.3", "respx>=0.22", "ruff>=0.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["meeting_agent"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["ui"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "PLC0415"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["docker: needs Docker and the bot image (make bot-image)"]
